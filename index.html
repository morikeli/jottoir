<!doctype html>
<html lang="en" class="bg-gray-50 dark:bg-zinc-900" style="color-scheme: light dark;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Synchronous anti-FOUC (Flash Of Unstyled Content) script -->
    <script>
      (function () {
        try {
          const theme = localStorage.getItem('theme');
          const supportDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
          
          if (theme === 'dark' || (!theme && supportDarkMode)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#18181b'; // zinc-900 hex fallback
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#f9fafb'; // gray-50 hex fallback
          }
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merienda:wght@300..900&display=swap" rel="stylesheet">
    <title>Jottoir</title>
  </head>
  <body class="bg-gray-50 dark:bg-zinc-900 text-gray-900 dark:text-zinc-100 font-cursive antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
